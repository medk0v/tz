server {
    listen 80;
    listen [::]:80;
    server_name tz.cyber-money.org;

    include /etc/nginx/snippets/tz-lite-cloudflare-real-ip.conf;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://tz.cyber-money.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tz.cyber-money.org;
    root /srv/tz/current/frontend/admin;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tz.cyber-money.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tz.cyber-money.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:tz_lite_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/tz-lite-cloudflare-real-ip.conf;

    client_max_body_size 55m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /api/v1/auth/login {
        limit_req zone=tz_lite_login_per_ip burst=6 nodelay;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/tz-lite-proxy.conf;
    }
    location = /widget/v1/sessions {
        limit_req zone=tz_lite_widget_session_per_ip burst=20 nodelay;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/tz-lite-proxy.conf;
    }
    location = /api/v1/ai/skills/generate {
        client_max_body_size 31m;
        limit_req zone=tz_lite_api_per_ip burst=6 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tz-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 610s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
    location ~ ^/(api|widget|public)/v1/ {
        limit_req zone=tz_lite_api_per_ip burst=90 nodelay;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/tz-lite-proxy.conf;
    }
    location ~ "^/[0-9a-fA-F-]{36}/api/[a-z][a-z0-9_-]{0,63}(/runs/[0-9a-fA-F-]{36})?$" {
        client_max_body_size 256k;
        limit_req zone=tz_lite_api_per_ip burst=90 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tz-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        # Allow the API to finish its maximum 300s response wait.
        proxy_read_timeout 330s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
    location ^~ /telegram/v1/webhooks/ {
        client_max_body_size 256k;
        limit_req zone=tz_lite_api_per_ip burst=90 nodelay;
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/tz-lite-proxy.conf;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tz_lite_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tz-Client-IP $remote_addr;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location ~ ^/(health/(live|ready)|openapi\.yaml)$ {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/tz-lite-proxy.conf;
    }
    location = /loader/widget-loader.js {
        alias /srv/tz/current/frontend/loader/widget-loader.js;
        default_type application/javascript;
        expires -1;
    }
    location = /widget/widget.html {
        alias /srv/tz/current/frontend/widget/widget.html;
        expires -1;
    }
    location ^~ /widget/assets/ {
        alias /srv/tz/current/frontend/widget/assets/;
        expires 1y;
    }
    location = /widget/ {
        return 302 /widget/widget.html;
    }
    # Keep bearer URLs out of access logs, including the SPA fallback.
    location ^~ /notes/share/ {
        access_log off;
        try_files /index.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
