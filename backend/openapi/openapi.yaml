        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/ai/profiles/{profile_id}/skills:
    put:
      tags: [AI]
      operationId: updateAiProfileSkills
      summary: Replace an agent's skill selection in the active project
      description: Requires AI management access without an Inbox scope. Replaces only this agent's bindings in the active project, preserving other agents, other projects, and skill content. The agent must be visible in the current scope, and each selected skill must belong to the active project. A skill can be assigned to at most 64 agents. Validation and replacement are atomic. Demo accounts cannot mutate assignments.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: profile_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiProfileSkills"
      responses:
        "200":
          description: Saved skill IDs, sorted by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiProfileSkills"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The agent or a selected skill is not available in the current scope.
        "409":
          description: A selected skill is already assigned to 64 other agents.
