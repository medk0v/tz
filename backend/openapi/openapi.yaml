        inbox_scope:
          deprecated: true
          description: Legacy Inbox restriction. Unsupported with all-project scope; new clients should choose a project scope.
          type: [array, "null"]
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    AccessToken:
      type: object
      required: [id, name, role, permissions, expires_at, created_at, project_scope, project_id, role_project_id]
      properties:
        project_scope:
          $ref: "#/components/schemas/AccessTokenProjectScope"
        project_id:
          type: [string, "null"]
          format: uuid
          description: Fixed project or null for all-project scope.
        role_project_id:
          type: [string, "null"]
          format: uuid
          description: Project supplying the live role definition. Null only for older tokens without a role source.
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        role_id:
          type: string
        role_name:
          type: string
        permissions:
          type: array
          items:
            type: string
        inbox_scope:
          type: [array, "null"]
          items:
            type: string
            format: uuid
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
    CreatedAccessToken:
      allOf:
        - $ref: "#/components/schemas/AccessToken"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: One-time plaintext token secret.
    Inbox:
      type: object
      required: [id, project_id, name, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
    InboxRoutingQueue:
      type: object
      additionalProperties: false
      required: [id, name, status, member_ids]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum: [active, disabled]
        member_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
    InboxRoutingRule:
      type: object
      additionalProperties: false
      required: [id, position, enabled, channel_id, language, queue_id]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          maximum: 64
          description: Contiguous one-based evaluation order; the first matching enabled rule wins.
        enabled:
          type: boolean
        channel_id:
          type: [string, "null"]
          format: uuid
        language:
          type: [string, "null"]
          minLength: 2
          maxLength: 35
          pattern: "^[a-z]{2,8}(-[a-z0-9]{1,8})*$"
          description: Normalized BCP 47 language tag. At least channel_id or language is required.
        queue_id:
          type: string
          format: uuid
    InboxWorkingInterval:
      type: object
      additionalProperties: false
      required: [id, weekday, starts_at, ends_at]
      properties:
        id:
          type: string
          format: uuid
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday where Monday is 1 and Sunday is 7.
        starts_at:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        ends_at:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Must be later than starts_at. Overnight coverage is represented by two intervals.
    InboxRoutingCoverage:
      type: object
      additionalProperties: false
      required: [timezone, weekly_intervals, outside_hours_action, no_operator_action]
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: Canonical IANA timezone used to interpret weekly wall-clock intervals.
        weekly_intervals:
          type: array
          maxItems: 28
          items:
            $ref: "#/components/schemas/InboxWorkingInterval"
        outside_hours_action:
          type: string
          enum: [ai, queue]
        no_operator_action:
          type: string
          enum: [ai, queue]
    InboxRoutingSla:
      type: object
      additionalProperties: false
      required:
        - clock
        - first_response_seconds
        - resolution_seconds
        - unassigned_warning_seconds
        - escalation_queue_id
      properties:
        clock:
          type: string
          enum: [elapsed, working_hours]
        first_response_seconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 604800
        resolution_seconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 2592000
        unassigned_warning_seconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 604800
          description: When both thresholds are configured, this must be less than first_response_seconds.
        escalation_queue_id:
          type: [string, "null"]
          format: uuid
    InboxRoutingTelegramInput:
      type: object
      additionalProperties: false
      required:
        - new_visitor
        - new_message
        - operator_request
        - unassigned_warning
        - sla_breach
        - chat_ids
      properties:
        new_visitor:
          type: boolean
        new_message:
          type: boolean
        operator_request:
          type: boolean
        unassigned_warning:
          type: boolean
        sla_breach:
          type: boolean
        chat_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: "^-?[0-9]{1,20}$"
    InboxRoutingTelegram:
      type: object
      additionalProperties: false
      required:
        - new_visitor
        - new_message
        - operator_request
        - unassigned_warning
        - sla_breach
        - chat_ids
        - bot_token_configured
      properties:
        new_visitor:
          type: boolean
        new_message:
          type: boolean
        operator_request:
          type: boolean
        unassigned_warning:
          type: boolean
        sla_breach:
          type: boolean
        chat_ids:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: "^-?[0-9]{1,20}$"
        bot_token_configured:
          type: boolean
          readOnly: true
    InboxRoutingConfigurationInput:
      type: object
      additionalProperties: false
      required:
        - enabled
        - assignment_strategy
        - default_queue_id
        - queues
        - rules
        - coverage
        - sla
        - telegram
      properties:
        enabled:
          type: boolean
        assignment_strategy:
          type: string
          enum: [manual, least_active]
        default_queue_id:
          type: [string, "null"]
          format: uuid
        queues:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/InboxRoutingQueue"
        rules:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/InboxRoutingRule"
        coverage:
          $ref: "#/components/schemas/InboxRoutingCoverage"
        sla:
          $ref: "#/components/schemas/InboxRoutingSla"
        telegram:
          $ref: "#/components/schemas/InboxRoutingTelegramInput"
    InboxTelegramBotTokenWrite:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              const: preserve
        - type: object
          additionalProperties: false
          required: [action, value]
          properties:
            action:
              type: string
              const: replace
            value:
              type: string
              minLength: 22
              maxLength: 256
              writeOnly: true
              description: Telegram bot token. Stored only as authenticated ciphertext and never returned.
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              const: clear
    InboxRoutingPutRequest:
      type: object
      additionalProperties: false
      required: [expected_version, configuration, telegram_bot_token]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
        configuration:
          $ref: "#/components/schemas/InboxRoutingConfigurationInput"
        telegram_bot_token:
          $ref: "#/components/schemas/InboxTelegramBotTokenWrite"
    InboxRoutingConfiguration:
      type: object
      additionalProperties: false
      required:
        - inbox_id
        - project_id
        - configured
        - version
        - enabled
        - assignment_strategy
        - default_queue_id
        - queues
        - rules
        - coverage
        - sla
        - telegram
      properties:
        inbox_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        configured:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
        enabled:
          type: boolean
        assignment_strategy:
          type: string
          enum: [manual, least_active]
        default_queue_id:
          type: [string, "null"]
          format: uuid
        queues:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/InboxRoutingQueue"
        rules:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/InboxRoutingRule"
        coverage:
          $ref: "#/components/schemas/InboxRoutingCoverage"
        sla:
          $ref: "#/components/schemas/InboxRoutingSla"
        telegram:
          $ref: "#/components/schemas/InboxRoutingTelegram"
    InboxRoutingChannelOption:
      type: object
      additionalProperties: false
      required: [id, name, kind, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
        status:
          type: string
    InboxRoutingOperatorOption:
      type: object
