      operationId: listAccessTokens
      summary: List access tokens without exposing their hashes or secrets
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Access tokens in the administrator scope.
          content:
            application/json:
              schema:
                type: object
                required: [items, can_create_all_projects]
                properties:
                  can_create_all_projects:
                    type: boolean
                    description: Only an administrator with tenant-wide access can create tokens for all projects.
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessToken"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Access Tokens]
      operationId: createAccessToken
      summary: Create an expiring token for one project or all tenant projects
      description: Module permissions come from the selected role in project_id. All-project tokens require tenant-wide administrator access; their role remains tied to this source project. The administrator role cannot be used for access tokens.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessTokenRequest"
      responses:
        "200":
          description: Token created. The secret is returned only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccessToken"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/access-tokens/{token_id}:
    parameters:
      - in: path
        name: token_id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Access Tokens]
      operationId: deleteAccessToken
      summary: Permanently delete an access token
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Access token permanently deleted and no longer authenticates.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
