          format: uuid
        channel_id:
          type: string
          format: uuid
        widget_name:
          type: string
        conversation_id:
          type: [string, "null"]
          format: uuid
        client_ip:
          type: [string, "null"]
        user_agent:
          type: [string, "null"]
        geo_ip:
          anyOf:
            - $ref: "#/components/schemas/GeoIpDetails"
