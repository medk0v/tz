    Contact:
      type: object
      additionalProperties: false
      required:
        - id
        - is_blocked
        - project_id
        - email
        - created_at
        - updated_at
        - client_ip
        - geo_ip
        - user_agent_details
        - browser_timezone
        - last_activity_at
        - channel_kinds
      properties:
        is_blocked:
          type: boolean
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        display_name:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
          description: Latest message or conversation creation time or widget presence within the actor's Inbox scope.
        channel_kinds:
          type: array
          items:
            type: string
          description: Distinct channel kinds from visible conversations.
        browser_timezone:
          type: [string, "null"]
          description: Latest retained browser timezone, subject to visitor_network:read.
        client_ip:
          type: [string, "null"]
          description: Latest retained server-derived IP address, available to authenticated sessions and access tokens with visitor_network:read.
        geo_ip:
          anyOf:
            - $ref: "#/components/schemas/GeoIpDetails"
            - type: "null"
        user_agent_details:
          anyOf:
            - $ref: "#/components/schemas/UserAgentDetails"
            - type: "null"
    ContactStatistics:
      type: object
      additionalProperties: false
      required: [contacts, new_contacts, returning_contacts, conversations, widget_sessions, widget_contacts, telegram_contacts, countries]
      description: Unique contacts are contact IDs, not IPs. New and returning use the first visible conversation. Conversations count those with creation or messages in the period. Sessions count retained widget sessions with creation or latest presence in the period; historical heartbeats are not retained. Country is the latest retained GeoIP location. Channel counts can overlap.
      properties:
        contacts:
          type: integer
          format: int64
        new_contacts:
          type: integer
          format: int64
        returning_contacts:
          type: integer
          format: int64
        conversations:
          type: integer
          format: int64
        widget_sessions:
          type: integer
          format: int64
        widget_contacts:
          type: integer
          format: int64
        telegram_contacts:
          type: integer
          format: int64
        countries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [country_code, country, contacts]
            properties:
              country_code:
                type: [string, "null"]
              country:
                type: [string, "null"]
              contacts:
                type: integer
                format: int64
    ContactList:
      type: object
      additionalProperties: false
      required: [items, total, page, per_page, total_pages, statistics]
      properties:
        statistics:
          $ref: "#/components/schemas/ContactStatistics"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        total:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 1
        per_page:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        total_pages:
          type: integer
          format: int64
          minimum: 0
    OnlineVisitorWidget:
