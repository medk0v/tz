      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlacklistReplyConfig"
      responses:
        "200":
          description: Updated channel settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/channels/{channel_id}/widget:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Operator]
      operationId: updateWidgetChannel
      summary: Update the public settings of a widget channel
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWidgetChannelRequest"
      responses:
        "200":
          description: Updated widget channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelConnection"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inboxes/{inbox_id}/conversations:
    get:
      tags: [Operator]
      operationId: listInboxConversations
      summary: List conversations that contain messages
      description: An explicitly included conversation is returned first, even before its first message, within the same authorized Inbox and all active filters.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: inbox_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: search
          description: Find conversations by exact conversation UUID or containing all search words in one text message.
          schema:
            type: string
            maxLength: 200
        - in: query
          name: include_conversation_id
          description: Include and prioritize this conversation even if it has no messages. All other filters and authorization scope still apply.
          schema:
            type: string
            format: uuid
        - in: query
          name: needs_reply
          description: Only active conversations with a customer message after the latest non-failed operator or AI reply. Independent of unread state.
          schema:
            type: boolean
            default: false
        - in: query
          name: mine
          description: Only conversations whose current assigned operator is the authenticated actor.
          schema:
            type: boolean
            default: false
        - in: query
          name: contact_id
          description: Only this contact's conversations within the same authorized Inbox.
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          description: Active includes every status except resolved.
          schema:
            type: string
            enum: [active, resolved, all]
            default: all
        - in: query
          name: channel_id
          description: Only conversations for this channel connection within the authorized Inbox.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversations visible to the actor, including the explicitly requested conversation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperatorConversation"
                  has_more:
                    type: boolean
                    description: More conversations match the same filters than the requested limit. Older responses omit this field; clients default to false.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/conversations/{conversation_id}/messages:
    get:
      tags: [Operator]
      operationId: listOperatorMessages
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - in: query
          name: after_sequence
          schema:
            type: integer
            format: int64
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Ordered message history visible to the actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Operator]
      operationId: createOperatorMessage
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperatorMessageRequest"
      responses:
        "200":
          description: Idempotently created operator message, or an administrator-authored message attributed to the active AI agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversation_id}/reply-suggestion-agents:
    get:
      tags: [Operator]
      operationId: listReplySuggestionAgents
      summary: List AI agents available to draft a reply
      description: Requires conversations:reply and access to the conversation Inbox. Available to the assigned operator, or to a session administrator replying as an active AI agent when no operator is assigned. Resolved conversations are excluded. Returns active agents connected to the conversation channel and compatible with its language.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: AI agents that can generate a reply draft for this conversation.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReplySuggestionAgent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversation_id}/reply-suggestions:
    post:
      tags: [Operator]
      operationId: generateReplySuggestion
      summary: Generate an AI reply draft
      description: Requires conversations:reply and access to the conversation Inbox. Available to the assigned operator, or to a session administrator replying as an active AI agent when no operator is assigned. Resolved conversations are excluded. The selected agent receives the current text-message history through the latest message. When draft_body is present, the agent returns only a context-aware continuation to append; otherwise it creates a new reply. The result is returned as a draft and is never sent automatically. Generating a draft does not join the administrator or disconnect the AI agent.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReplySuggestionRequest"
      responses:
        "200":
          description: Generated reply draft based on the current conversation history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateReplySuggestionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/conversations/{conversation_id}/read:
    post:
      tags: [Operator]
