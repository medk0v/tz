          name: view_id
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          schema:
            type: string
            maxLength: 200
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
    post:
      tags:
        - Notes
      operationId: createNoteDatabaseRecord
      summary: Create a database record
      description: >-
