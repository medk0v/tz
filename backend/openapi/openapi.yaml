        page_url:
          type: [string, "null"]
          format: uri
        page_title:
          type: [string, "null"]
        referrer:
          type: [string, "null"]
          format: uri
        language:
          type: string
          description: Resolved widget language shown to the visitor.
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    OnlineVisitorList:
      type: object
      additionalProperties: false
      required: [items, online_window_seconds]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/OnlineVisitor"
        online_window_seconds:
          type: integer
          format: int64
          minimum: 1
    AiChannelOption:
      type: object
      additionalProperties: false
      required: [id, inbox_id, kind, name, status]
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - widget
            - external_api
            - telegram_bot
            - telegram_business
            - telegram_tdlib
            - gmail
            - imap_smtp
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [draft, connecting, active, degraded, reauth_required, disabled]
    BlacklistReplyConfig:
      type: object
      additionalProperties: false
      required: [default_language, translations]
      properties:
        default_language:
          type: string
          description: Language tag present in translations, used when the visitor language has no match.
          maxLength: 35
        translations:
          type: object
          minProperties: 1
          maxProperties: 32
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4000
    ResourceVisibility:
      type: object
      additionalProperties: false
      description: Empty selections make the resource visible in all projects or departments of the organization. Omission on update preserves existing visibility. Only administrators or the director workspace can choose bindings; other users automatically create resources in their current project and department.
      properties:
        project_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          default: []
          items: {type: string, format: uuid}
        department_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          default: []
          items: {type: string, format: uuid}
      required: [project_ids, department_ids]
    CustomAiChannelInput:
      type: object
      additionalProperties: false
      required: [name, inbox_id, mode, source_kind]
      properties:
        visibility:
          $ref: "#/components/schemas/ResourceVisibility"
        name:
          type: string
          minLength: 1
          maxLength: 200
        icon:
          type: string
          default: bot
          enum: [bot, globe, message-circle, mail, briefcase, users, headset, send, linkedin, phone, workflow, layers]
        inbox_id:
          type: string
          format: uuid
        connection_type:
          type: string
          enum: [ai_agent, external_api]
          default: ai_agent
          description: Planned source of data. Both methods are saved as inactive drafts.
        destination:
          type: string
          enum: [conversations, tasks, custom]
          default: conversations
          description: Intended action inside the workspace. Saving does not create conversations, tasks, or execute other actions.
        mode:
          type: string
          enum: [instructions, agent]
          description: Agent selection mode for AI connections. External API configurations normalize this to instructions.
        source_url:
          type: string
          maxLength: 4096
          default: ""
          description: Optional HTTPS source or documentation address without embedded credentials. Empty means no source address was provided. Saving does not establish a connection or generate an incoming API endpoint.
        source_kind:
          type: string
          enum: [website, api]
        instructions:
          type: string
          maxLength: 50000
          description: Where to navigate, what to read, and what to do inside the workspace. At least 10 trimmed characters for AI instructions mode or custom destination; otherwise optional.
        ai_profile_id:
          type: [string, "null"]
          format: uuid
          description: Required for AI agent mode with the same management permissions as the agent settings. Must be null or omitted for external API or AI instructions mode.
    CustomAiChannel:
      type: object
      required: [id, name, icon, inbox_id, connection_type, destination, mode, source_url, source_kind, instructions, status, ai_profile_id, created_at, updated_at]
      properties:
        inbox_name:
          type: string
        visibility:
          $ref: "#/components/schemas/ResourceVisibility"
        id:
          type: string
          format: uuid
          description: Channel connection ID.
        name:
          type: string
        icon:
          type: string
          enum: [bot, globe, message-circle, mail, briefcase, users, headset, send, linkedin, phone, workflow, layers]
        inbox_id:
          type: string
          format: uuid
        connection_type:
          type: string
          enum: [ai_agent, external_api]
        destination:
          type: string
          enum: [conversations, tasks, custom]
        mode:
          type: string
          enum: [instructions, agent]
        source_url:
          type: string
          description: Empty or an HTTPS source/reference address.
        source_kind:
          type: string
          enum: [website, api]
        instructions:
          type: string
        ai_profile_id:
          type: [string, "null"]
          format: uuid
          description: Null if no agent was chosen or the previously selected agent has since been deleted.
        status:
          type: string
          enum: [draft]
          description: Configuration only. Message collection and delivery are unavailable until an executor is connected.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
