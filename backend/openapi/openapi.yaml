      description: >-
        Requires tasks:manage without an Inbox-scoped access token, processes:read and an active project; a run
        would be created in that project. Process visibility applies as for reading it: an invisible process
        returns 404, and so does a never-approved process for callers who can neither edit nor approve it.
        Returns the steps of the latest approved version with the position that performs each one (the first
        selected position, in the order of the process, that is R or AR for the step), the owner position, and
        only the positions that perform a step or own the process, labelled from the approved snapshot. holders
        lists who holds a position now: team assignments of employees and agents and company-structure seats,
        read in the position's own project, without technical access-token users and limited to those eligible
        in the current project. people and agents list everyone a task of the current project accepts as a
        participant; the launcher may choose any of them for any position. RACI and position assignments
        never grant access; task eligibility rules decide. suggested names the holder of every position that
        has exactly one eligible holder, and problems lists what blocks a launch. A never-approved process is
        returned to its editors and approvers with version null, no steps or positions and the not_approved
        problem. Read-only. Demo sessions are refused with 403. Not available in the Lite edition.
      security:
