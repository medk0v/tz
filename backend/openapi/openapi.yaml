          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Reply Templates]
      operationId: createReplyTemplate
      summary: Create a reusable reply in an Inbox
      description: Requires reply_templates:manage and access to the selected project and Inbox. Stored content is Markdown, never executable HTML.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyTemplateInput"
      responses:
        "201":
          description: Reply template created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inboxes/{inbox_id}/reply-templates/{template_id}:
    parameters:
      - in: path
        name: inbox_id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: template_id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Reply Templates]
      operationId: updateReplyTemplate
      summary: Update a reusable reply in an Inbox
      description: Requires reply_templates:manage and access to the selected project and Inbox. Replaces both title and body.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyTemplateInput"
      responses:
        "200":
          description: Reply template updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Reply Templates]
      operationId: deleteReplyTemplate
      summary: Delete a reusable reply from an Inbox
      description: Requires reply_templates:manage and access to the selected project and Inbox.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Reply template deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inboxes/{inbox_id}/reply-template-draft-agents:
    parameters:
      - in: path
        name: inbox_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reply Templates]
      operationId: listReplyTemplateDraftAgents
      summary: List AI agents available to draft a reply template
      description: Requires reply_templates:manage and access to the selected project and Inbox. Returns active agents of the project with an active OpenAI-compatible model connection that are visible to the caller. Inbox-scoped access tokens see only agents whose channels belong to their Inboxes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: AI agents that can draft a reply template.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReplySuggestionAgent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/inboxes/{inbox_id}/reply-template-drafts:
    parameters:
      - in: path
        name: inbox_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Reply Templates]
      operationId: generateReplyTemplateDraft
      summary: Draft a reply template from its title
      description: Requires reply_templates:manage and access to the selected project and Inbox. The selected agent writes reusable customer-facing template text for the title, using its instructions and, on the OpenClaw runtime, its assigned published knowledge. The title must contain 1 to 120 characters and draft_body at most 10000. When draft_body is present, the agent returns only a continuation to append; otherwise it drafts the complete text. Nothing is saved.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentDraftRequest"
      responses:
        "200":
          description: Generated Markdown draft for the person to review and save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/inboxes/{inbox_id}/routing:
    parameters:
      - in: path
        name: inbox_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Routing]
      operationId: getInboxRoutingConfiguration
      summary: Get the complete routing configuration and live editor options for an Inbox
      description: Requires routing:manage and access to the selected project and Inbox. Telegram bot tokens are never returned.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Routing configuration plus live channel and eligible operator options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRoutingEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Routing]
      operationId: replaceInboxRoutingConfiguration
      summary: Atomically replace the complete routing configuration for an Inbox
      description: Requires routing:manage, Inbox scope, an exact expected_version, and a non-nil UUID Idempotency-Key. Reusing a key with the same request replays the stored secret-free configuration; a different request conflicts. Replacing or clearing the Telegram bot token additionally requires a password-backed session.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxRoutingPutRequest"
      responses:
        "200":
          description: The stored routing configuration plus current live editor options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxRoutingEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/inboxes/{inbox_id}/online-visitors:
    parameters:
      - in: path
        name: inbox_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Operator]
      operationId: listOnlineVisitors
      summary: List visitors with a recently active widget session
      description: Requires visitor_network:read permission on the authenticated session or access token.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Visitors currently considered online for this Inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineVisitorList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/widgets:
    get:
      tags: [Operator]
      operationId: listOnlineVisitorWidgets
      summary: List active widgets available for online visitor filtering
      description: Requires visitor_network:read permission and returns only active, non-deleted widget channels within the actor's project and Inbox scope.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Widget channels available to the actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineVisitorWidgetList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/widgets/{widget_id}/online-visitors:
    parameters:
      - in: path
        name: widget_id
        required: true
        description: Internal channel connection identifier of the widget.
        schema:
          type: string
          format: uuid
    get:
      tags: [Operator]
      operationId: listWidgetOnlineVisitors
      summary: List visitors with a recently active session for one widget
      description: Requires visitor_network:read permission and access to the widget's Inbox.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Visitors currently considered online for this widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineVisitorList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/visitor-sessions/{session_id}/conversation:
    post:
      tags: [Operator]
      operationId: startVisitorConversation
      summary: Start a conversation with an online widget visitor
      description: Requires visitor_network:read, conversations:read, conversations:reply and access to the visitor Inbox. Reuses the active conversation or creates one, and joins the current operator when no operator is assigned. Existing assignments are preserved.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation ready to open in the operator workspace.
          content:
            application/json:
              schema:
                type: object
                required: [id, inbox_id]
                properties:
                  id:
                    type: string
                    format: uuid
                  inbox_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/contacts:
    get:
      tags: [Operator]
      operationId: listContacts
      summary: List contacts visible to the actor
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [day, week, month, custom, all]
            default: day
        - in: query
          name: from
          description: Inclusive start of a custom period.
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          description: Exclusive end of a custom period.
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: search
          schema:
            type: string
            maxLength: 200
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Visible contacts active in the selected period (last 24 hours by default), ordered by activity within that period. Statistics use the same period, search and authorization scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contacts/{contact_id}/block:
    parameters:
      - in: path
        name: contact_id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Operator]
      operationId: setContactBlocked
      summary: Add a contact to or remove a contact from the project blacklist
      description: Requires contacts:manage and access to all Inbox records associated with the contact.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [blocked]
              properties:
                blocked:
                  type: boolean
      responses:
        "200":
          description: Updated contact blacklist state.
          content:
            application/json:
              schema:
                type: object
                required: [id, is_blocked]
                properties:
                  id:
                    type: string
                    format: uuid
                  is_blocked:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/channels:
    get:
      tags: [Operator]
      operationId: listChannels
