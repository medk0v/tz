  /api/v1/processes/{id}/launch:
    post:
      tags:
        - Processes
      operationId: launchProcess
      summary: Launch an approved process as an editable team task
      description: >-
        Requires tasks:manage without an Inbox-scoped access token, processes:read and an active project. Demo
        sessions are refused with 403. Process visibility applies as for reading it (invisible returns 404).
        Creates an ordinary team-mode task in the current project from the latest approved version, through the
        same validation, limits, board placement and audit as POST /api/v1/ai/tasks: text is the run name, or
        the process title, followed by the purpose; expected_result is the expected outcome cut to 5000
        characters; the participant of the owner position coordinates; plan_steps copies the approved steps in
        order, with the step description (or its title when empty) as instructions and the participant of the
        step's performing position as performer. participants must name every performing position and the
        owner position exactly once; any employee or agent eligible in the current project may be chosen, one
        participant may fill several positions, and the coordinator may perform steps. The task pins the
        launched version in process, owns its copy of the steps and stays fully editable through the tasks API;
        later approvals and archiving do not change existing runs. The request carries no visibility: the task
        gets the visibility a task created by the caller gets without one, narrowed to the places where the
        process is visible, because it copies the purpose, the steps and the performers of the process. A
        process open to the whole organization changes nothing: the task of an administrator or a director is
        open to the organization, anybody else's is bound to the current project and the caller's department
        or, without one, the default department of the project. A process restricted to projects or
        departments gives the task of an administrator or a director exactly that restriction, without
        projects and departments that no longer exist; the automatic binding of other callers stays inside
        it, and when their department is none of the process's, as for an access token that works in no
        department, the task goes to the departments of the process in the current project instead. Whoever
        may choose visibility can change it afterwards through the tasks API. With start true (the default) and a manual
        schedule a team execution starts in the same transaction, exactly like
        POST /api/v1/ai/tasks/{task_id}/executions; when it cannot start, nothing is created. start is ignored
        for other schedule kinds, which run on their schedule. The launch itself is not idempotent: repeating
        the request creates another task. Returns 409 for an archived process, for a process without an
        approved version (404 for callers who can neither edit nor approve it) and when the approved version
        or the archive flag changed while the launch was being stored. Returns 400 for more than 30 steps, a
        name above 200 characters or with a NUL character, an unknown, repeated or missing position, a participant who is not eligible
        in the current project, and for every rule of task creation and of starting an execution. A body that
        is empty or not syntactically valid JSON is answered by the JSON extractor with a plain-text 400
        instead of the error envelope, like the 413, 415 and 422 cases. Writes
        ai_task.created, ai_task_execution.started when started, and process.launched in the project that owns
        the process. Not available in the Lite edition.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ProjectScope"
        - $ref: "#/components/parameters/CsrfToken"
        - in: header
          name: Idempotency-Key
          required: false
          description: >-
            UUID used as the idempotency key of the execution started by this launch; a fresh key is generated
            without it. Read only when the run starts right away, where a malformed value returns 400. It does
            not deduplicate the created task.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessLaunchInput"
      responses:
        "201":
          description: Task created, and its execution when it was started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessLaunchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The process is archived, has no approved version, or changed while the launch was being stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: The body exceeds the default 2 MB request limit. Plain-text response of the JSON extractor.
        "415":
          description: The body is not sent as application/json. Plain-text response of the JSON extractor.
        "422":
          description: The JSON body has an unknown field or a value of the wrong type. Plain-text response of the JSON extractor.
