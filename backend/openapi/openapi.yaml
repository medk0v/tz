          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/conversations/{conversation_id}/return-to-ai:
    post:
      tags: [Operator]
      operationId: returnConversationToAi
      summary: Transfer an operator-owned conversation to an available AI agent
      description: The assigned operator or a session administrator with Inbox access may transfer the conversation directly to AI. The most recent eligible AI participant is preferred, falling back to a compatible channel agent with automatic joining enabled. The operator is removed only when an eligible AI is available. An unanswered customer message queues AI reply work immediately.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The current operator has left and the AI agent now owns replies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnConversationToAiResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
