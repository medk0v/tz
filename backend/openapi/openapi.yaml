              schema:
                $ref: "#/components/schemas/VisitorIntelligence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/conversations/{conversation_id}/resolve:
    post:
      tags: [Operator]
      operationId: resolveConversation
      summary: Resolve an active conversation
      description: Joining is not required. The resolution is attributed to the assigned operator when present, or to the current actor otherwise; resolving alone does not join or assign that actor.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_rating:
                  type: boolean
                  default: true
                  description: Set false to close without a widget rating prompt or email/Telegram invitation.
                note:
                  type: [string, "null"]
                  maxLength: 1000
      responses:
        "200":
          description: Resolution cycle returned or created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resolution"
        "409":
          $ref: "#/components/responses/Conflict"
