        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel connection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/channels/{channel_id}:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Operator]
      operationId: deleteChannel
      summary: Delete a supported channel connection
      description: Disables the connection, unregisters Telegram webhooks when applicable, and preserves conversation history.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Widget channel deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/custom-ai-channels:
    get:
      tags: [Operator]
      operationId: listCustomAiChannels
      summary: List custom channel drafts in the actor's Inbox scope
      description: Requires channels:read. These saved configurations do not execute instructions, read external messages, or deliver replies.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Saved channel configurations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomAiChannel"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Operator]
      operationId: createCustomAiChannel
      summary: Save a custom channel draft with an AI agent or external API source
      description: Requires channels:manage and access to the selected Inbox. The channel remains inactive until a source executor is implemented and connected. No credentials should be stored in instructions or the URL.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomAiChannelInput"
      responses:
        "201":
          description: Draft configuration saved; no external account connection established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomAiChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/custom-ai-channels/{channel_id}:
    parameters:
      - in: path
        name: channel_id
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Operator]
      operationId: updateCustomAiChannel
      summary: Replace a custom channel draft's configuration
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomAiChannelInput"
      responses:
        "200":
          description: Draft configuration updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomAiChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Operator]
      operationId: deleteCustomAiChannel
      summary: Soft-delete a custom channel draft
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The channel is disabled and removed from the visible list.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/channels/telegram-bots:
    post:
      tags: [Operator]
      operationId: createTelegramBotChannel
      summary: Connect a Telegram bot to an Inbox
      description: Stores the bot token as encrypted write-only data and registers the Telegram webhook asynchronously. Requires a password-backed session.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTelegramBotChannelRequest"
      responses:
        "201":
          description: Telegram bot connection queued for webhook registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/channels/phone:
