        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskMoveInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskMoveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/task-steps/mine:
    get:
      tags: [Tasks]
      operationId: listMyTaskSteps
      summary: List team steps waiting for the signed-in employee
      description: >-
        Requires tasks:own or tasks:manage. Returns running steps of unfinished team executions in the active project assigned to the caller: work with its prerequisite results, a plan to write as coordinator, or results to review as coordinator.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWaitingStepList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/task-steps/{step_id}/submit:
    parameters:
      - in: path
        name: step_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      operationId: submitTaskStep
      summary: Submit an employee's answer to a team step
      description: Only the assigned employee can answer a running step. Work takes output and an optional status of completed or blocked; blocked pauses the execution for attention. A coordinator's planning step takes steps assigning work to team members, validated like an agent's plan. A coordinator's review takes status complete, needs_revision (once, with revisions) or incomplete, with result and reason. Returns the updated execution.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskStepSubmission"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskExecution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/tasks/{task_id}/executions:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [AI]
      operationId: listAiTaskExecutions
      summary: List the 30 most recent team executions
      description: Requires tasks:manage, or tasks:own for a task in which the caller participates.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Project-scoped execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskExecutionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [AI]
      operationId: startAiTaskExecution
      summary: Start a team execution from the current task and profile instructions
      description: Requires tasks:manage. A UUID Idempotency-Key replays the same execution; an unfinished execution blocks another start. Planning validates member identities and an acyclic dependency graph, workers execute ready steps, and the coordinator reviews and combines results with at most one revision round. Instructions and permission ceilings are snapshotted; provider and model availability are revalidated on each step. OpenClaw executions share the existing isolated runtime lane. Executions have a one-hour deadline and up to 40 attempts across 20 steps. A task with plan_steps is seeded from that plan instead of being planned, so there is no planning step or planning call, the plan.predefined event replaces plan.accepted, the steps form a linear chain in which each step receives only the result of the previous one, and the coordinator, agent or employee, only gets the final review, which sees every result. The execution stays queued until its first step is claimed, or is running at once when that step belongs to an employee. Such executions allow up to 30 work steps, 2 x work + 2 step rows (one full correction round), max(40, 2 x work + 10) attempts, up to 30 corrections in one review instead of 12, and max(60, 10 x work + 10) minutes for a team of agents alone; any team with an employee has 30 days. A start fails with 400 when a step is assigned to somebody outside the team. Results remain in task history; explicitly permitted specialist tools may perform actions. Terminal history is retained for 30 days.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Project-scoped execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskExecution"
        "200":
          description: Project-scoped execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskExecution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/task-executions/{execution_id}:
    parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [AI]
      operationId: getAiTaskExecution
      summary: Read one team result, its steps and execution events
      description: Requires tasks:manage, or tasks:own for a task in which the caller participates. A step is performed either by an agent (agent_id) or by an employee (assignee_user_id).
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Project-scoped execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskExecution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/task-executions/{execution_id}/cancel:
    parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [AI]
      operationId: cancelAiTaskExecution
      summary: Cancel an execution and revoke running tool access
      description: Requires tasks:manage. Cancellation is idempotent. Runtime capacity remains occupied until the owner cleans up its grants or its bounded lease expires; completed external actions cannot be undone.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Project-scoped execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskExecution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/task-executions/{execution_id}/retry:
    parameters:
      - in: path
        name: execution_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [AI]
      operationId: retryAiTaskExecutionStep
      summary: Resume a failed or blocked step with no external side effects
      description: Requires tasks:manage. The execution must be stopped with no running attempts and remain before its original deadline. Steps are limited to three attempts; effectful steps require checking their external outcome instead of a blind retry.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [step_id]
              properties:
                step_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Project-scoped execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskExecution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/integrations/apis:
    get:
      tags: [Integrations]
      operationId: listApiIntegrations
      summary: List visible API integrations and assignable AI profiles
      description: Requires a password-backed session and integrations management access. Results follow the selected project and department visibility; an explicit Inbox-only scope is not supported. Secrets are never returned.
