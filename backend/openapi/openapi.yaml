      - in: path
        name: token_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Access Tokens]
      operationId: revokeAccessToken
      summary: Revoke an access token while preserving its audit-visible record
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Access token revoked.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
