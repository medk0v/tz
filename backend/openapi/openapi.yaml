            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/task-tags:
    post:
      tags: [Tasks]
      operationId: createTaskTag
      summary: Create a task tag
      description: Requires tasks:configure without an Inbox-scoped access token. Not available in the Lite edition. Names are unique per project, ignoring case; a project can have up to 200 tags.
      security:
        - cookieAuth: []
        - bearerAuth: []
