    post:
      tags: [Operator]
      operationId: takeOverConversation
      summary: Let a session administrator join in place of the assigned operator
      description: The operator who handles the conversation leaves it and the administrator owns replies, the same way joining replaces an active AI agent. Without an assigned operator this behaves like a regular join.
