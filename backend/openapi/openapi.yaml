    ApiIntegrationActionInput:
      type: object
      additionalProperties: false
      required: [key, name, description, path_template]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        path_template:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "^/[^/].*|^/$"
          description: Relative absolute-path with optional query parameters and snake_case placeholders such as /orders/{id}?account={account_id}; schemes, hosts, fragments, backslashes, percent escapes, and dot segments are rejected.
    ApiIntegrationInput:
      type: object
      additionalProperties: false
      required:
        - name
        - key
        - description
        - base_url
        - status
        - auth_kind
        - clear_token
        - actions
        - ai_profile_ids
      properties:
        visibility:
          $ref: "#/components/schemas/ResourceVisibility"
        name:
          type: string
          minLength: 1
          maxLength: 200
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
          description: Stable project-unique key that cannot be changed after creation.
        description:
          type: string
          maxLength: 2000
        base_url:
          type: string
          format: uri
          maxLength: 2000
          description: HTTPS port 443 URL without credentials, query, or fragment; normalized without a trailing slash.
        status:
          type: string
          enum: [active, disabled]
        auth_kind:
          type: string
          enum: [none, bearer, x_api_key]
        token:
          type: string
          minLength: 8
          maxLength: 8192
          writeOnly: true
          description: An 8-8192 character header value. Required on create for bearer and x_api_key; omitted on update to preserve the configured token.
        clear_token:
          type: boolean
          description: Must be false for bearer and x_api_key. Switching auth_kind to none removes stored token metadata.
        actions:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/ApiIntegrationActionInput"
        ai_profile_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: Visible AI profiles in this organization granted every action; integration keys must be unique per profile; each profile may have at most 32 API integrations, 128 total actions, and 128 KiB of runtime catalog metadata.
    ApiIntegrationAction:
      type: object
      additionalProperties: false
      required: [id, key, name, description, path_template, parameter_names]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        name:
          type: string
        description:
          type: string
        path_template:
          type: string
        parameter_names:
          type: array
          uniqueItems: true
          maxItems: 32
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{0,63}$"
    ApiIntegration:
      type: object
      additionalProperties: false
      required:
        - visibility
        - id
        - name
        - key
        - description
        - base_url
        - status
        - auth_kind
        - token_configured
        - actions
        - ai_profile_ids
        - created_at
        - updated_at
      properties:
        visibility:
          $ref: "#/components/schemas/ResourceVisibility"
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
        description:
          type: string
        base_url:
          type: string
          format: uri
        status:
          type: string
          enum: [active, disabled]
        auth_kind:
          type: string
          enum: [none, bearer, x_api_key]
        token_configured:
          type: boolean
        actions:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ApiIntegrationAction"
        ai_profile_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ApiIntegrationAiProfile:
