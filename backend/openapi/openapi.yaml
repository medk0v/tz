        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    agentApiKey:
      type: http
      scheme: bearer
      description: Dedicated invocation key scoped to one AI agent.
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: tz_session
      description: Password session cookie. Use X-Tz-Project-Id on operator requests to select a project independently of other browser windows; project access is checked on every request.
  parameters:
    ConversationId:
      in: path
      name: conversation_id
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      in: path
      name: project_id
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      in: path
      name: membership_id
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: false
      description: Required for unsafe requests authenticated by a browser session cookie.
      schema:
        type: string
    ProjectScope:
      in: header
      name: X-Tz-Project-Id
      required: false
      description: Accessible active project for this request. Supported by password sessions and access tokens; fixed-project tokens may only select their own project.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Non-nil UUID used to safely replay supported state-changing requests with the same payload.
      schema:
        type: string
        format: uuid
    SupportRatingToken:
      in: header
      name: X-Support-Rating-Token
      required: true
      description: High-entropy token recovered by the browser from the email URL fragment.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    PublicNoteShareLocked:
      description: The link requires a password, the password is wrong, or its unlock token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PublicNoteShareUnavailable:
      description: The link is unavailable or revoked, or the requested note is outside its current scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NoteShareUnlockRateLimited:
      description: The link exceeded 10 unlock attempts per minute or all 4 process-wide password workers are occupied. Retry after 60 seconds.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: string
            const: "60"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The request payload or one of its fields is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The actor cannot access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The resource does not exist in the actor scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The requested operation conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required external service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    NoteDatabase:
      type: object
