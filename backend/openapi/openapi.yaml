    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name, slug, inbox_name]
      properties:
        parent_project_id:
          type: [string, "null"]
          format: uuid
          description: Standard edition only. Optional active root project in the same tenant, requiring unrestricted administrator membership and projects:manage access. Null or omitted creates a standalone project. Subprojects cannot contain another level; resource access is never inherited.
        project_kind:
          type: string
          enum: [project, company]
          description: Defaults to project when omitted.
        company_profile:
          description: Requires project_kind company. Omitted or null creates an empty profile for a company.
          anyOf:
            - $ref: "#/components/schemas/CompanyProfileInput"
            - type: "null"
        departments:
          type: array
          description: Omission creates a Support department. An empty array is allowed only with an enabled control center; the control center becomes the default workspace and an inbox is created without a department.
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProjectDepartmentInput"
        default_department_index:
          type: integer
          minimum: 0
          description: Index of the default department. Must be omitted when departments is empty.
        director_enabled:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        inbox_name:
          type: string
          minLength: 1
          maxLength: 200
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        director_menu:
          $ref: "#/components/schemas/DirectorMenu"
        parent_project_id:
          type: [string, "null"]
          format: uuid
          description: Standard edition only. Omitted leaves the parent unchanged; null makes the project standalone; a UUID moves it under an active root project in the same tenant with administrator and projects:manage access. A project with subprojects cannot become a subproject. Disabling a project requires moving or disabling its active subprojects first; a subproject cannot be activated under a disabled parent.
        project_kind:
          type: string
          enum: [project, company]
          description: An ordinary project may become a company. Converting a company back to an ordinary project is not supported.
        company_profile:
          description: Replaces the complete company profile when an object is supplied. Omitted or null leaves the profile unchanged. Requires an existing company or project_kind company in the same request.
          anyOf:
            - $ref: "#/components/schemas/CompanyProfileInput"
            - type: "null"
        default_department_id:
          type: string
          format: uuid
        director_enabled:
          type: boolean
        default_director_workspace:
          type: boolean
          description: Turning the control center off also clears this flag.
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        status:
          type: string
          enum: [active, disabled]
        appearance:
          description: Standard edition only. Replaces both workspace colors when an object is supplied; a null or omitted field inside it returns that choice to each member. Omitted or null leaves the colors unchanged. Logos have their own endpoint.
          anyOf:
            - $ref: "#/components/schemas/ProjectAppearanceInput"
            - type: "null"
