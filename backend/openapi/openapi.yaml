                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiSkill"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AI]
      operationId: createAiSkill
      summary: Create a skill and assign it to agents
      description: Requires AI management access without an Inbox scope. Skill names are unique within a project, ignoring case. Agent references are validated atomically against current tenant and resource access. Demo accounts cannot mutate skills.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSkillInput"
      responses:
        "201":
          description: Skill created with its agent assignments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: An assigned agent is not available in the current scope.
        "409":
          description: A skill with this name already exists in the project.
  /api/v1/ai/skills/generate:
    post:
      tags: [AI]
      operationId: generateAiSkill
      summary: Create an editable skill draft from a purpose and source materials
      description: Requires unrestricted AI management access and an active model connection in the selected project. Demo accounts are denied. Text, books and images are temporary generation inputs and are not stored. The response must be reviewed and saved through the regular skill API. Tools are disabled for generation. Long text is analyzed in bounded chunks without silently dropping the end of a book. Text-based PDFs with classic cross-reference tables are supported; compressed object/cross-reference streams and incremental updates require re-export without object compression or conversion to another supported format. Scanned-only PDFs require OCR or page images. Image inputs require a model supporting images. At most 10 files, 20 MiB per file (10 MiB per image), 30 MiB aggregate input, and 1000000 extracted source characters. Generation may take up to 10 minutes.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [provider_connection_id, goal]
              properties:
                provider_connection_id:
                  type: string
                  format: uuid
                goal:
                  type: string
                  minLength: 1
                  maxLength: 10000
                source_text:
                  type: string
                  maxLength: 1000000
                file:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                  description: Repeated file parts. Accepted formats are TXT, Markdown, PDF, DOCX, EPUB, JPEG, PNG and WebP.
      responses:
        "200":
          description: Generated draft; no skill or source files have been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSkillDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Model connection is not active or does not belong to the selected project.
        "413":
          description: Source files or extracted text exceed their limits.
        "415":
          description: Unsupported source format or mismatched file content.
        "429":
          description: Generation capacity is busy; retry shortly.
