      operationId: generateKnowledgeArticleDraft
      summary: Draft a knowledge material from its title
      description: Requires knowledge:manage and access to the knowledge base in the selected project. The selected agent writes reference content for the material title, using its instructions and, on the OpenClaw runtime, its assigned published knowledge. Unknown details are left as marked placeholders for the editor. The title must contain 1 to 300 characters and draft_body at most 200000. When draft_body is present, the agent returns only a continuation to append; otherwise it drafts the complete text. Nothing is saved.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentDraftRequest"
      responses:
        "200":
          description: Generated Markdown draft for the person to review and save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDraftResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/ai/channel-options:
    get:
      tags: [AI]
      operationId: listAiChannelOptions
      summary: List minimal channel assignment options in the active project
      description: Requires ai:manage and returns only channels in Inbox scopes available to the actor.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Project-scoped channel options without public IDs or channel configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiChannelOption"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/ai/task-attachments:
    post:
      tags: [AI]
      operationId: uploadTaskScreenshot
      summary: Upload a private file for a task draft
      description: Requires tasks:manage without an Inbox-scoped access token. Accepts one file, scanned using attachment storage settings. Allowed formats are PNG, JPEG and WebP (10 MiB); PDF, DOCX, XLSX, PPTX, ODT, ODS, ODP, TXT, CSV, TSV, MD and ZIP (20 MiB); MP4 and WebM (50 MiB). Business documents are served as binary downloads without previews. Office packages and text are validated; macros, active document parts, encrypted or nested archives and unsupported formats are rejected. ZIP members must use allowed formats, with a shared 50 MiB expanded size and 2048-entry limit. Pass the returned ID in attachment_ids when saving a task. Only the uploader can access or attach an unlinked upload, which expires after 24 hours. At most 20 unlinked uploads per actor and project are allowed.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File ready to attach to a task.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: File exceeds its type-specific size limit or the workspace attachment storage quota is full.
        "415":
          description: Declared media type does not match the extension or media content is invalid.
        "503":
          description: Attachment storage or scanning is unavailable.
  /api/v1/ai/task-attachments/{attachment_id}:
    get:
      tags: [AI]
      operationId: downloadTaskScreenshot
      summary: Download a file with the same access as its task
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: attachment_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private file bytes with no-store, nosniff and an attachment Content-Disposition containing the original UTF-8 filename.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            application/pdf: {}
            video/mp4: {}
            video/webm: {}
            application/octet-stream: {}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/tasks:
    get:
      tags: [AI]
      operationId: listAiTasks
      summary: List manual and scheduled AI task definitions in the active project
      description: Requires tasks:own or tasks:manage without an Inbox-scoped access token. tasks:manage covers every task visible in the workspace; tasks:own covers only tasks where the caller is an assigned employee, the coordinator or the assignee of a team step. Independent tasks execute each profile separately; team tasks use a coordinator with dependent specialist steps and one combined result. Manual tasks have no next occurrence. Output and errors are retained in project task history, with no automatic result delivery. Schedule times are due-at targets rather than exact start guarantees. After downtime, at most one missed occurrence is materialized and the schedule advances from current database time. A due occurrence is coalesced whenever the same task still has an unfinished independent run or team execution. Durable per-project cursors round-robin due materialization and run claims across worker restarts so one project cannot indefinitely starve another. Disabled projects pause new materialization and claiming until re-enabled; a run already past its final project-status check may finish.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Project-scoped AI task definitions with their next calculated occurrence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: "#/components/schemas/AiTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [AI]
      operationId: createAiTask
      summary: Create a manual or scheduled AI task in the active project
      description: Requires tasks:manage without an Inbox-scoped access token. A one-time run_at may be in the past; saving it keeps the date and does not schedule another automatic run. Independent mode accepts up to 32 agents and 32 employees; a scheduled independent task needs at least one agent. Team mode requires one to eight members, agents and employees together, plus a distinct coordinator that is either an agent (coordinator_id) or an employee (coordinator_user_id). Employees must be active members of the project; department-restricted managers can assign only employees of their department. Manual team drafts may use unconfigured profiles; scheduling or starting requires active executable profiles. Results remain in project task history and are not delivered automatically. Direct scheduled-task providers must use public HTTPS endpoints; DNS answers are revalidated and pinned per execution, while the exact configured OpenClaw runtime is the only local-endpoint exception. Each project may contain at most 500 tasks. A team task may carry a predefined plan in plan_steps (1 to 30 steps) instead of being planned by its coordinator. The server then derives the members from the step performers, ignores the agent_ids and assignee_ids that were sent and drops agent_roles entries of anyone who performs no step; the one-to-eight rule does not apply, a plan task may have no members at all, and the coordinator may perform steps itself. Every performer passes the same checks as a member. An agent named in agent_ids, in coordinator_id or as the performer of a plan step that is unknown or not visible to the caller returns 404. The process marker of a launched process is set only by POST /api/v1/processes/{id}/launch and cannot be set through the tasks API.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTaskInput"
      responses:
        "201":
          description: AI task schedule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/tasks/{task_id}:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [AI]
      operationId: updateAiTask
      summary: Replace a task goal, execution mode, schedule and team
      description: Requires tasks:manage without an Inbox-scoped access token. Pending independent runs from the previous definition are cancelled. Existing team executions retain their captured goal, team, role instructions, predefined plan and permission ceiling. Provider/model settings are resolved live for each step. No result is delivered automatically. Omitting plan_steps keeps the stored predefined plan, null clears it and an array replaces it. When plan_steps is omitted and another update changes the stored plan before this one is written, the request returns 409 and changes nothing, so a full replacement sent by a calendar or a list never undoes a plan edit; reload the task and repeat the update. The members of a plan task are derived from its performers again on each update. Its agents, the coordinator included, are validated on every update. Its employees are validated and rewritten only when the request names plan_steps, even with the stored plan, or when the derived employee members or the employee coordinator differ from the stored ones; an update that leaves them as they are, such as rescheduling, is accepted even if one of them could no longer be assigned by the caller. A text containing a NUL character returns 400, as does such a plan step title or instruction. A task cannot switch to independent mode until its plan is cleared. The process marker of a launched process is immutable; it cannot be set, changed or removed through the tasks API, and the steps of such a task can be edited, reordered, added and removed but the plan cannot be cleared.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiTaskInput"
      responses:
        "200":
          description: AI task schedule updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: plan_steps was omitted and the stored plan changed while the update was being stored. Nothing was changed; reload the task before saving.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [AI]
      operationId: deleteAiTask
      summary: Delete one AI task definition
      description: Requires tasks:manage without an Inbox-scoped access token. Deletion is rejected while an independent run is processing, a team execution is unfinished, or a team attempt still owns runtime capacity.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: AI task definition deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/tasks/{task_id}/runs:
    parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [AI]
      operationId: listAiTaskRuns
      summary: List recent per-agent runs for one scheduled AI task
      description: Requires tasks:own or tasks:manage without an Inbox-scoped access token. tasks:manage covers every task visible in the workspace; tasks:own covers only tasks where the caller is an assigned employee, the coordinator or the assignee of a team step. Returns at most 100 runs ordered by scheduled_for descending and then id descending. Each row includes the immutable task-text snapshot executed independently by that profile using its current instructions. Output and errors are task-history records only and are never delivered automatically to a customer, channel, or Telegram. The worker retains the newest 100 terminal runs per task plus every pending or processing run and prunes older terminal output.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Recent task execution history, including output or bounded error details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/AiTaskRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [AI]
      operationId: startIndependentAiTaskRuns
      summary: Run the assigned agents independently now
      description: Requires tasks:manage and a UUID Idempotency-Key. The task needs at least one agent. A repeated key returns history without duplicating runs. Another unfinished independent run or team execution blocks a new start.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recent independent runs, including the queued manual occurrence.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/AiTaskRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ai/task-calendar:
    get:
      tags: [AI]
      operationId: listAiTaskCalendar
      summary: List task occurrences that started within a period
      description: Requires tasks:own or tasks:manage without an Inbox-scoped access token. tasks:manage covers every task visible in the workspace; tasks:own covers only tasks where the caller is an assigned employee, the coordinator or the assignee of a team step. Returns independent runs merged per task occurrence and team executions whose scheduled or manual start falls within [from, to), ordered by start time. Future occurrences are not included; derive them from each task schedule. Only tasks visible to the caller are included, and history follows the per-task retention of task runs. Not available in the Lite edition.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          required: true
          description: Inclusive start of the period.
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          description: Exclusive end of the period, after from and at most 62 days later.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Started occurrences within the period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTaskCalendarResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/task-reminders:
    get:
      tags: [Tasks]
      operationId: listTaskReminders
      summary: List the caller's unread task reminders
      description: Requires tasks:own or tasks:manage without an Inbox-scoped access token. Returns the caller's own unread reminders for tasks they may still open and that are not completed, newest first, at most 50. Each reminder reads the task through a join, so a renamed or rescheduled task reads correctly and one the caller has lost access to is omitted. unread counts the same set, up to 100. Not available in the Lite edition.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller's unread reminders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReminderList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/task-reminders/read:
    post:
      tags: [Tasks]
      operationId: markTaskRemindersRead
      summary: Mark the caller's reminders as read
      description: Requires tasks:own or tasks:manage without an Inbox-scoped access token. Only the caller's own reminders are affected, so this can never silence somebody else's bell. Ids that are already read or belong to another person are ignored. Not available in the Lite edition.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReminderReadInput"
      responses:
        "204":
          description: The reminders are read.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/task-board:
    get:
      tags: [Tasks]
      operationId: getTaskBoard
      summary: Read lists, statuses, tags and participants of the task board
      description: Requires tasks:own or tasks:manage. Creates the project's default list with its preset statuses on first use. With tasks:own only, returns the lists, tags, employees and agents of the caller's own tasks plus the default list. Not available in the Lite edition.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskBoard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
