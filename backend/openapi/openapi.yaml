            schema:
              $ref: "#/components/schemas/PhoneChannelInput"
      responses:
        "201":
          description: Phone channel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneGatewayCredentials"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/channels/phone/{channel_id}:
    patch:
      tags: [Operator]
      operationId: updatePhoneChannel
      summary: Update a phone channel
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
