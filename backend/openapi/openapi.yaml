  /{profile_id}/api/{slug}:
    parameters:
      - in: path
        name: profile_id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: slug
        required: true
        schema:
          type: string
    post:
      tags:
        - AI
      operationId: invokeAiAgentApi
      security:
        - agentApiKey: []
      description: >-
        Invokes the saved method using raw input JSON. Authentication uses a dedicated key scoped to this agent,
        not an operator access token. Waits through queueing and execution and returns the result or a terminal error.
        Legacy response_wait_seconds values do not shorten this wait. The worker must be running. Task instructions and output shape cannot be
        overridden by the caller. With cache_refresh_seconds configured, the worker refreshes periodically
        using input_example, callers must send exactly that JSON, and the response immediately contains
        result, updated_at (successful refresh timestamp), and stale (older than refresh interval).
        Idempotency-Key and wait_seconds do not affect cache reads. Failed refreshes preserve the previous
        snapshot. Editing the method or rotating its key requires a new successful refresh.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: >-
            Non-nil UUID scoped to this agent key. Reusing it for different input or a different method is a
            conflict. Records are retained for seven days.
          schema:
            type: string
            format: uuid
        - in: query
          name: wait_seconds
          required: false
          description: >-
            Deprecated compatibility parameter; accepted but ignored. Calls always wait for completion.
          schema:
            type: integer
            minimum: 0
            maximum: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: >-
            Live mode returns the validated result directly. Cached mode returns an envelope with result
            matching the output schema, updated_at (UTC date-time), and stale (boolean).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Idempotency conflict, unavailable agent, or cancelled invocation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    required:
                      - error
                      - run_id
                    properties:
                      run_id:
                        type: string
                        format: uuid
                      error:
                        type: object
                        required:
                          - code
                          - message
                        properties:
                          code:
                            type: string
                          message:
                            type: string
        '422':
          description: Input validation failed or a configured JSON field has the wrong type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Agent invocation limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: The agent could not complete the task or returned invalid output.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - run_id
                properties:
                  run_id:
                    type: string
                    format: uuid
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '503':
          description: Cached method has no successful snapshot yet (cache_warming). Retry after warmup.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 5
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                        enum: [cache_warming]
                      message:
                        type: string
        '504':
          description: Execution or queue deadline exceeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - run_id
                properties:
                  run_id:
                    type: string
                    format: uuid
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /{profile_id}/api/{slug}/runs/{run_id}:
    parameters:
      - in: path
        name: profile_id
