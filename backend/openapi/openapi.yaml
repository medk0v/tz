          description: Conversation timeline background.
        control_background_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#FFFFFF"
          description: Inputs, operator messages, cards, and secondary controls.
        control_text_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1B1B1D"
          description: Text displayed on secondary controls and operator messages.
        muted_text_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#6A6B6E"
          description: Secondary labels, timestamps, placeholders, and helper text.
        divider_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#E3E4E6"
          description: Internal dividers and control or message borders.
        online_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#27A857"
          description: Online availability indicators.
        offline_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#8A8F98"
          description: Offline availability indicators.
        danger_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#A93027"
          description: Errors and destructive feedback.
        rating_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#F3B72F"
          description: Rating stars and rating highlights.
        shadow_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#000000"
          description: Widget, launcher, invitation, and message shadows.
        status_text_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Status text in the chat header. Falls back to muted_text_color.
        launcher_background_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Launcher button background. Falls back to accent_color.
        launcher_icon_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Launcher icon and label. Falls back to accent_text_color.
        input_background_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Message input background. Falls back to control_background_color.
        input_text_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Message input text. Falls back to control_text_color.
        input_placeholder_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Message input placeholder. Falls back to muted_text_color.
        footer_text_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Footer text. Falls back to muted_text_color.
        sound_icon_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Sound button icon. Falls back to muted_text_color.
        close_icon_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Close button icon. Falls back to muted_text_color.
        send_background_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Send button background. Falls back to accent_color.
        send_icon_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          description: Send button icon. Falls back to accent_text_color.
