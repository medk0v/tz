  /api/v1/ai/profiles/{profile_id}/test-runs/{run_id}/recommendations/apply:
    post:
      tags: [AI]
      operationId: applyAiTestRecommendations
      summary: Apply reviewed exact source replacements atomically
      description: >-
        Requires AI management and complete profile Inbox access. Profiles used by autonomous
        tasks or API endpoints require project-wide scope. Article edits also require
        knowledge management, knowledge-base dependency scope, an active assigned base, and
        a successful read in the recorded run. Checks every source revision and exact unique
        original fragment before saving the batch in one transaction. Conflicts save nothing.
        Changes only source text; preserves article publication status, other settings, and run evidence.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: run_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: object
                    additionalProperties: false
                    required: [source_key, expected_revision, original_text, suggested_text]
                    properties:
                      source_key: { type: string }
                      expected_revision: { type: string }
                      original_text: { type: string, minLength: 1, maxLength: 12000 }
                      suggested_text: { type: string, minLength: 1, maxLength: 12000 }
      responses:
        "200":
          description: Updated sources with their new revisions
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiTestAppliedSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A source revision changed, original text is missing or ambiguous, or replacements overlap. No changes were saved.
