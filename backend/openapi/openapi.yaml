      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteDatabase"
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
    delete:
      tags:
        - Notes
      operationId: deleteNoteDatabase
      summary: Delete an unreferenced database
      description: >-
        Requires notes:write in the active project. Writes validate scope and versions under a project
        lock.
      security:
