        schema:
          type: string
          format: uuid
    get:
      tags: [Reply Templates]
      operationId: listReplyTemplates
      summary: List reusable replies for an Inbox
      description: Requires conversations:reply or reply_templates:manage and access to the selected project and Inbox. Returns all templates ordered by title and id.
