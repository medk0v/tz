    NoteShare:
      type: object
      additionalProperties: false
      required: [id, note_id, custom_slug, has_password, can_edit, created_at, theme_palette, theme_mode, allow_theme_change, include_descendants, included_note_ids, version]
      properties:
        theme_palette:
          type: [string, "null"]
          enum: [ocean, ink, graphite, forest, plum, copper, paper, null]
          default: null
        theme_mode:
          type: [string, "null"]
          enum: [light, dark, null]
          default: null
        allow_theme_change:
          type: boolean
          default: true
        include_descendants:
          type: boolean
          default: true
          description: Follow included child pages recursively; false publishes only the share root or selected project root pages.
        included_note_ids:
          type: [array, "null"]
          default: null
          maxItems: 5000
          uniqueItems: true
          items:
            type: string
            format: uuid
          description: >-
            Null preserves automatic inclusion of current and future pages. An explicit array selects exact
            current pages and must contain every ancestor up to the share root, which is always implicit,
            or up to the project root level. Unchecked ancestors close their entire subtree. Empty means
            root-only for a note share and no pages for a project share. Selected descendant IDs may be
            retained while include_descendants is false, but are not traversed until it is enabled.
        version:
          type: integer
          format: int32
          minimum: 1
        id:
          type: string
          format: uuid
        note_id:
          type: [string, "null"]
          format: uuid
          description: Root of a shared subtree; null selects the project scope. Visibility settings may restrict either scope.
        custom_slug:
          type: [string, "null"]
          description: Public token for a named link; null for a random secret.
        has_password:
          type: boolean
        can_edit:
          type: boolean
        created_at:
          type: string
          format: date-time
