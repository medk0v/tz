  /api/v1/public/notes/databases:
    post:
      tags:
        - Notes
      operationId: publicNoteDatabaseAction
      summary: Read or edit databases exposed by a note publication
      description: >-
        Tokens are sent only in the JSON body. The current publication scope and password grant are
        checked on every action. Only tables embedded in accessible notes are exposed. Relations and
        rollups targeting unpublished tables are removed before filtering, sorting, search and
        pagination. Saved views are presentation, not row-level permissions. Record
        create/update/delete additionally require can_edit. Field create/update/delete are allowed for
        editable publications and published relation targets only. Views, embeds and ordering are
        managed in the workspace. Responses carry no-store and no-referrer headers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicNoteDatabaseRequest"
      responses:
        "200":
          description: >-
            Result depends on action: list => database list; embeds => embed list; detail => detail;
            records => paginated list; record/create_record/update_record => record; delete_record =>
            null.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NoteDatabaseList"
                  - $ref: "#/components/schemas/NoteDatabaseEmbedList"
                  - $ref: "#/components/schemas/NoteDatabaseDetail"
                  - $ref: "#/components/schemas/NoteDatabaseRecordList"
                  - $ref: "#/components/schemas/NoteDatabaseRecord"
                  - $ref: "#/components/schemas/NoteDatabaseField"
                  - type: string
                    nullable: true
                    enum:
                      - null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PublicNoteShareLocked"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PublicNoteShareUnavailable"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/notes:
    parameters:
      - $ref: "#/components/parameters/ProjectScope"
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List notes in the active project
      description: Requires notes:read. Returns page metadata without bodies for the shared project tree, ordered by parent_id (roots first), sort_order and id.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Project note summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Notes]
      operationId: createNote
      summary: Create a note in the active project
      description: Requires notes:write. A parent must be an existing note in the same active project. New notes are appended after the current siblings.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The JSON body is missing required fields, contains unknown fields, or has invalid field types.
  /api/v1/notes/{note_id}/move:
    parameters:
      - $ref: "#/components/parameters/ProjectScope"
      - in: path
        name: note_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Notes]
      operationId: moveNote
      summary: Move a note before a sibling or into another parent
      description: >-
        Requires notes:write and the note's current expected_version. parent_id and before_id must
        both be explicit, with null meaning the project root and the end of the sibling list respectively.
        The parent and anchor must be in the same active project; the anchor must belong to the target parent.
        Moving into descendants or before itself is rejected. Placement is changed atomically without
        modifying the title, body, icon or favorite status. The moved note's version increments;
        renumbering sibling positions does not change those siblings' content versions.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveNoteRequest"
      responses:
        "200":
          description: Moved note and the complete ordered project tree metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveNoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Source, parent or anchor does not exist in the required project and sibling scope.
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Required fields are missing, unknown fields are present, or JSON field types are invalid.
  /api/v1/notes/{note_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectScope"
      - in: path
        name: note_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Notes]
      operationId: getNote
      summary: Read a note and its Markdown body
      description: Requires notes:read. Notes outside the active project are not found.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current note content and version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Notes]
      operationId: updateNote
      summary: Save all editable fields of a note
      description: >-
        Requires notes:write and all editable fields, including an explicit nullable parent_id.
        The parent must be in the same active project and cannot be the note itself or one of its descendants.
        expected_version must match the stored version; successful saves increment the version.
        A stale save returns 409 without replacing the stored content. Changing parent_id appends the note after the target parent's existing children; content-only edits preserve its order.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Saved note with its incremented version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: The JSON body is missing required fields, contains unknown fields, or has invalid field types.
    delete:
      tags: [Notes]
      operationId: deleteNote
      summary: Delete a note without children
      description: >-
        Requires notes:write and the current expected_version. Returns 409 if the version is stale
        or the note still has children. Child pages must be moved or deleted explicitly first.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - in: query
          name: expected_version
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "204":
          description: Note deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{project_id}/company-governance:
    get:
      tags: [Projects]
      operationId: getCompanyGovernance
      summary: Read company teams, working roles and decision authority
      description: >-
        Standard edition only. Requires an active company membership and a password session.
        Department-restricted readers receive only company-wide and their own department's teams,
        roles and minimal position labels. Managers receive the complete editable document.
        Administrative cross-project access requires administrator membership in the target project.
        Organizational authority does not grant system permissions or agent tools.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectScope"
      responses:
        "200":
          description: Current governance document; a new company has revision zero and an empty hybrid model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyGovernance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      operationId: saveCompanyGovernance
      summary: Save company principles, teams and role authority
      description: >-
        Requires an unrestricted password member with teams:manage and CSRF protection.
        Cross-project administrators also need teams:manage in the target project.
        All changes are saved atomically against the last observed revision, including the first save.
        Position assignments must belong to the same company and fit the team's department.
        Roles assigned to AI agents require explicit authority, escalation and a human delegating position.
        Assignments do not grant access or change the organization chart, tasks or agent tools.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectScope"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, content]
              properties:
                revision:
                  type: integer
                  minimum: 0
                content:
                  $ref: "#/components/schemas/CompanyGovernanceContent"
      responses:
        "200":
          description: Saved governance document and updated revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyGovernance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{project_id}/company-structure:
    get:
      tags: [Projects]
      operationId: getCompanyStructure
      summary: Read company positions and reporting lines
      description: >-
        Requires an unrestricted password administrator session with administrator membership in the company project.
        Demo accounts and access tokens are excluded. Returns existing department, member, agent and job-position choices.
        Organizational assignments do not grant or change account permissions.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectScope"
      responses:
        "200":
          description: Current company structure and available choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyStructure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      operationId: createCompanyPosition
      summary: Add a company position
      description: >-
        Requires the same administrator access as reading the structure and CSRF protection.
        Maximum 500 positions per company. References must belong to the same project; linked users must have active membership.
        Reporting lines must be acyclic and each department can have at most one head position.
        A department-specific job template must match the position's department.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ProjectScope"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPositionInput"
      responses:
        "201":
          description: Position added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPosition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/projects/{project_id}/company-structure/{position_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ProjectScope"
      - name: position_id
        in: path
        required: true
