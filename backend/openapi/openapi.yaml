        can_create:
          type: boolean
        can_manage_positions:
          type: boolean
        can_manage_access:
          type: boolean
    ProcessLaunchParticipant:
      type: object
      additionalProperties: false
      required:
        - position_id
        - kind
        - id
      description: The employee or agent who takes a position of the process in one run.
      properties:
        position_id:
          type: string
          format: uuid
          description: A position that performs a step or owns the process.
        kind:
          type: string
          enum:
            - agent
            - employee
        id:
          type: string
          format: uuid
          description: AI profile id for an agent, user id for an employee.
    ProcessLaunchPosition:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - department_name
        - project_id
        - project_name
        - roles
        - holders
      description: A position that needs a participant before the process can be launched. Labels come from the approved snapshot.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        department_name:
          anyOf:
            - type: string
            - type: "null"
        project_id:
          type: string
          format: uuid
          description: The position's own project, where its holders are read.
        project_name:
          type: string
        roles:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: performer when the position performs at least one step, owner when it owns the process; its participant coordinates the run.
          items:
            type: string
            enum:
              - performer
              - owner
        holders:
          type: array
          description: >-
            Current holders who are eligible in the current project, employees first and then agents, each
            by name. A suggestion only; holding a position grants no access.
          items:
            $ref: "#/components/schemas/AiTaskPlanPerformer"
    ProcessLaunchPreview:
      type: object
      additionalProperties: false
      required:
        - process
        - steps
        - owner_position_id
        - positions
        - people
        - agents
        - suggested
        - problems
        - max_steps
      properties:
        process:
          type: object
          additionalProperties: false
          required:
            - id
            - title
            - version
            - archived
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
              description: The approved title, or the draft title while nothing is approved.
            version:
              anyOf:
                - type: integer
                  format: int32
                  minimum: 1
                - type: "null"
              description: The latest approved version, which a launch would use; null while nothing is approved.
            archived:
              type: boolean
        steps:
          type: array
          maxItems: 100
          description: Steps of the latest approved version, in order; empty while nothing is approved.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - title
              - description
              - performer_position_id
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              description:
                type: string
              performer_position_id:
                anyOf:
                  - type: string
                    format: uuid
                  - type: "null"
                description: First selected position, in the order of the process, that is R or AR for the step. Approved versions always have one.
        owner_position_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          description: Owner position of the approved version; its participant coordinates the run.
        positions:
          type: array
          maxItems: 50
          description: Only positions that perform a step or own the process, in the order of the process.
          items:
            $ref: "#/components/schemas/ProcessLaunchPosition"
        people:
          type: array
          description: Every employee a task of the current project accepts, by name; a department-restricted caller sees employees of their department or without one.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
              - can_answer
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              can_answer:
                type: boolean
                description: False when the employee holds neither tasks:own nor tasks:manage in the current project and so could not open or answer their steps.
        agents:
          type: array
          description: Every agent the caller sees in the current project, by name.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
              - ready
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              ready:
                type: boolean
                description: Whether an execution with this agent could start now, by the same rule as a manual start - an active profile in an active project with an active OpenAI or OpenAI-compatible connection.
        suggested:
          type: object
          additionalProperties: false
          required:
            - coordinator
            - participants
          properties:
            coordinator:
              anyOf:
                - $ref: "#/components/schemas/AiTaskPlanPerformer"
                - type: "null"
              description: The single eligible holder of the owner position, if there is exactly one.
            participants:
              type: array
              description: One entry for every listed position, the owner position included, that has exactly one eligible holder.
              items:
                $ref: "#/components/schemas/ProcessLaunchParticipant"
        problems:
          type: array
          maxItems: 3
          description: What blocks a launch; empty when the process can be launched.
          items:
            type: object
            additionalProperties: false
            required:
              - code
              - detail
            properties:
              code:
                type: string
                enum:
                  - not_approved
                  - archived
                  - too_many_steps
              detail:
                type: string
        max_steps:
          type: integer
          description: Most steps a run supports; currently 30.
    ProcessLaunchInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
          maxLength: 200
          description: Names this run, trimmed. Without it, or when blank, the process title is used. A NUL character is rejected with 400.
        participants:
          type: array
          default: []
          maxItems: 50
          description: Exactly one entry for every position that performs a step and for the owner position; other positions are rejected. One person or agent may take several positions.
          items:
            $ref: "#/components/schemas/ProcessLaunchParticipant"
        schedule:
          $ref: "#/components/schemas/AiTaskSchedule"
          description: Defaults to the manual schedule. Other kinds make the run recurring or delayed and require executable agents, as for any scheduled task.
        starts_at:
          type:
            - string
            - "null"
          format: date-time
          description: Start of the task's time span, whose end is due_at. Not available in the Lite edition.
        due_at:
          type:
            - string
            - "null"
          format: date-time
          description: Deadline of the created task.
        all_day:
          type: boolean
          description: The span covers whole days in time_zone rather than a time of day. Defaults to false. Not available in the Lite edition.
        time_zone:
          type:
            - string
            - "null"
          maxLength: 100
          description: IANA zone the span was entered in, which its instants cannot recover. Not available in the Lite edition.
        list_id:
          type:
            - string
            - "null"
          format: uuid
          description: Board list of the created task; the project's default list without it.
        start:
