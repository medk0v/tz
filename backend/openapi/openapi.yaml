        "200":
          description: Phone channel updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/channels/phone/{channel_id}/gateway-token:
    post:
      tags: [Operator]
      operationId: rotatePhoneGatewayToken
      summary: Replace the gateway token of a phone channel
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - in: path
          name: channel_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: New token; the previous one stops working.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneGatewayCredentials"
        "404":
          $ref: "#/components/responses/NotFound"
  /telephony/v1/asterisk/calls:
    post:
      tags: [Telephony]
      operationId: registerAsteriskCall
      summary: Register an incoming call from the Asterisk dialplan
      description: Returns the call id to pass to AudioSocket. Calls without a ready agent are recorded as unanswered.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                caller:
                  type: string
                callee:
                  type: string
      responses:
        "200":
          description: Call id.
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        "404":
          description: Unknown or disabled channel token.
  /telephony/v1/asterisk/calls/{call_id}/next:
    post:
      tags: [Telephony]
      operationId: nextAsteriskCallAction
      summary: Tell Asterisk what to do after the agent leg ends
      security: []
      parameters:
        - in: path
          name: call_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: "`transfer:<number>` to hand the call to an operator, `unavailable` to play the gateway's prerecorded failure announcement, or `hangup`."
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Unknown call or token.
  /api/v1/channels/{channel_id}/blacklist:
