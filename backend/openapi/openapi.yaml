        Returns current source text and its revision; historical snapshot content is unchanged.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Current instruction source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Test is still running.
    patch:
      tags: [AI]
      operationId: updateAiTestSource
      summary: Save one used instruction source with an optimistic revision check
      description: >-
        Requires the same access as getAiTestSource. Updates only the selected profile instruction field
        or article body. A stale revision returns 409. Article edits increment the article version and
        preserve its title, status, and publication time. Audit records contain source identifiers only.
        Historical test evidence, other settings, and other article fields remain unchanged.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, expected_revision]
              properties:
                text:
                  type: string
                  maxLength: 200000
                  description: Trimmed on save. Profile instruction fields are limited to 50000 characters.
                expected_revision:
                  type: string
                  description: Exact revision returned by the current source read.
      responses:
        "200":
          description: Saved source, including the new revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiTestSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source changed since it was read, or the test is still running.
