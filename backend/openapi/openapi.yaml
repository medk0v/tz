        palette:
          type: [string, "null"]
          pattern: "^[a-z][a-z0-9-]{0,31}$"
          description: Operator workspace palette id, such as ocean, ink, graphite, forest, plum, copper, or paper. Clients ignore ids they do not know.
        mode:
