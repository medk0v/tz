        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTagInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/task-tags/{tag_id}:
    parameters:
      - in: path
        name: tag_id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Tasks]
      operationId: updateTaskTag
      summary: Rename or recolor a task tag
      description: Requires tasks:configure without an Inbox-scoped access token. Not available in the Lite edition.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTagUpdate"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      operationId: deleteTaskTag
      summary: Delete a task tag
      description: Requires tasks:configure without an Inbox-scoped access token. Not available in the Lite edition. The tag is removed from its tasks. Its direct children become top-level tags; their task links and descendants are preserved.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
