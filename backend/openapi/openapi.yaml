  /api/v1/mobile-push/config:
    get:
      tags: [Operator]
      operationId: getMobilePushConfig
      summary: Check native mobile push availability
      description: Requires a password session or a project-scoped access token with conversations:read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Whether the server accepts Android registrations.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/mobile-push/devices/{installation_id}:
    parameters:
      - in: path
        name: installation_id
        required: true
        description: A stable random UUID generated by the native app for this installation.
        schema:
          type: string
          format: uuid
      - $ref: "#/components/parameters/CsrfToken"
    put:
      tags: [Operator]
      operationId: registerMobilePushDevice
      summary: Register or refresh this installation's Android FCM token
      description: >-
        Requires a password session or access token with conversations:read in its selected project.
        A registration belongs to the current session or access token, user, and project. Register again
        after login, project selection, or token rotation. Changing that binding cancels
        queued deliveries for the old binding. At most 32 devices per account.
        FCM data contains only generic text and IDs, never message or contact content.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, token]
              properties:
                project_id:
                  type: string
                  format: uuid
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
      responses:
        "200":
          description: Installation registered for the current credential and project.
          content:
            application/json:
              schema:
                type: object
                required: [installation_id, project_id, enabled]
                properties:
                  installation_id:
                    type: string
                    format: uuid
                  project_id:
                    type: string
                    format: uuid
                  enabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Mobile push is disabled or unconfigured.
    delete:
      tags: [Operator]
      operationId: unregisterMobilePushDevice
      summary: Remove this credential's native push registration
      description: Idempotent; cannot remove a registration owned by a different session, access token, or user. Access tokens require conversations:read and an assigned project.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: Registration removed or already absent. Also supported while push is disabled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
