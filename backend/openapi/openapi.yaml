    WidgetLauncher:
      type: object
      additionalProperties: false
      required: [launcher_type, position, label, show_greeting, show_operator_profile, offset_x, offset_y, attention_animation, animation_interval_seconds, proactive_invitation_enabled, proactive_invitation_delay_seconds]
      properties:
        launcher_type:
          type: string
          enum: [icon, text, icon_text]
        position:
          type: string
          enum: [bottom_right, bottom_left]
        label:
          type: string
          minLength: 1
          maxLength: 40
        show_greeting:
          type: boolean
          default: true
          description: Shows the localized greeting when an empty chat is opened.
          example: Chat with us
        show_operator_profile:
          type: boolean
          default: false
          description: Shows the joined operator's public name, avatar, and joined status. When disabled, visitors continue to see the generic support identity.
        offset_x:
          type: integer
          format: int32
          minimum: 0
          maximum: 120
          example: 20
        offset_y:
          type: integer
          format: int32
          minimum: 0
          maximum: 120
          example: 20
        attention_animation:
          type: string
          enum: [pulse, lift, sway, none]
          default: pulse
          description: Repeating attention animation. Pulse remains available while the greeting is shown; a hidden greeting normalizes pulse to lift.
        animation_interval_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 300
          default: 5
          example: 5
        proactive_invitation_enabled:
          type: boolean
          default: false
          description: Shows a configured invitation above the launcher after a delay while the visitor has never opened the conversation.
        proactive_invitation_delay_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 300
          default: 15
          example: 15
