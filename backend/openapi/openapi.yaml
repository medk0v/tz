      description: Only a password-authenticated administrator can update roles. The administrator role is system-managed. Existing project memberships and access tokens are updated atomically; access-token-only restrictions remain enforced.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Updated role definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Access Tokens]
      operationId: deleteRole
      summary: Delete an unused project role
      description: The administrator role cannot be deleted. Active members must be moved and active access tokens revoked first.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: role_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
      responses:
        "204":
          description: Role deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
