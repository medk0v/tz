    post:
      tags: [Tasks]
      operationId: moveAiTask
      summary: Move a task to a status and position
      description: Requires tasks:manage, or tasks:own for a task in which the caller participates. Participants move their task between statuses of its list; managers may also move it to another list. Moving into a done column marks the task completed. Not available in the Lite edition.
      security:
        - cookieAuth: []
        - bearerAuth: []
