      type: string
      enum: [system, arial, verdana, tahoma, trebuchet_ms, georgia, times_new_roman, courier_new]
      default: system
      description: Built-in font stack. Named fonts fall back to the matching generic font family if unavailable on the visitor's device.
    WidgetTheme:
      type: object
      required: [accent_color, accent_text_color, surface_color, text_color, border_radius]
      additionalProperties: false
      properties:
        accent_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#F05A28"
        accent_text_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#FFFFFF"
        surface_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#FFFFFF"
        text_color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          example: "#1B1B1D"
        component_colors:
          $ref: "#/components/schemas/WidgetComponentColors"
          description: Optional complete light component palette. Existing themes derive these colors from the four base colors.
        dark:
          $ref: "#/components/schemas/WidgetDarkTheme"
          description: Optional dark palette. Existing themes without it use the server defaults.
        border:
          $ref: "#/components/schemas/WidgetBorder"
          description: Optional outer chat-window border settings. Existing themes use a 1 px default border.
        border_radius:
          type: integer
          format: int32
          minimum: 0
          maximum: 32
          default: 20
          example: 20
        font_family:
          $ref: "#/components/schemas/WidgetFontFamily"
          description: Selected widget font, also used as a fallback when the website font is unavailable. Existing themes use the system font.
        use_site_font:
          type: boolean
          description: Use the embedding website's font when available. Existing themes keep the selected widget font.
        reply_typing_effect:
          type: boolean
          description: Animate the display of new widget replies with a typing effect. Defaults to false; existing themes display replies immediately.
        opening_animation:
          type: boolean
          description: Animate the widget opening with a colored outline trace in the standard edition. Defaults to true for existing themes; ignored in the Lite edition.
        launcher_icon:
          type: string
          enum: [chat, message_circle, headphones]
          description: Launcher button icon, shared by both color palettes. Defaults to chat.
        send_icon:
          type: string
          enum: [send, arrow_up, arrow_right]
          description: Send button icon, shared by both color palettes. Defaults to send.
        footer_text:
          type: [string, "null"]
          maxLength: 160
          description: Custom widget footer text. Null uses the localized default; an empty string hides the footer.
