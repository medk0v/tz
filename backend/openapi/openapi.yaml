      tags: [Projects]
      operationId: uploadProjectLogo
      summary: Replace the project's logo for one theme, shown in its workspace instead of the product logo
      description: Standard edition only. Requires an unrestricted administrator password session for the project. Accepts JPEG, PNG, or WebP images up to 2 MB and 4096 × 4096 pixels; SVG is rejected.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
