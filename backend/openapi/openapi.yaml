          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          minLength: 1
          maxLength: 64
        instructions:
          type: string
          minLength: 1
          maxLength: 50000
        input_example:
          type: object
          additionalProperties: true
          description: >-
            Example used to infer required input properties and their JSON types. Nested objects are strict; array
            examples must contain an item.
        output_example:
          type: object
          additionalProperties: true
          description: >-
            Example used to infer and validate the successful result shape. Values are examples, not constant
            results.
        enabled:
          type: boolean
        response_wait_seconds:
          type: integer
          minimum: 0
          maximum: 300
          default: 20
          description: >-
            Deprecated compatibility field, stored but ignored. Live calls always wait for completion.
        cache_refresh_seconds:
          type: [integer, 'null']
          minimum: 60
          maximum: 86400
          default: null
          description: >-
            Enables periodic background refresh with input_example as fixed input. Null disables caching.
            Cached calls require exactly input_example and return {result, updated_at, stale} immediately.
            A missing snapshot returns 503 cache_warming; failed refreshes preserve the last success.
        timeout_seconds:
          type: integer
          minimum: 10
          maximum: 300
          default: 180
