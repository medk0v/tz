openapi: 3.1.0
info:
  title: Support API
  version: 0.1.0
  description: >-
    API for the customer communication platform. Authenticated operator
    requests may include X-Tz-Project-Id to select an accessible active
    project for that request. Password sessions use this header to keep project
    windows independent, including their department selection and presence.
    Requests without the header use the session's selected project. All-project
    access tokens use their role source project when the header is absent;
    fixed-project tokens reject a different requested project.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Widget
  - name: Authentication
  - name: Operator
  - name: Routing
  - name: Quality
  - name: Email
  - name: Projects
  - name: Teams
  - name: AI
  - name: Integrations
  - name: Knowledge Base
  - name: Reply Templates
  - name: Access Tokens
  - name: Realtime
  - name: Processes
  - name: Tasks
    description: Kanban lists, statuses, tags and team steps performed by employees.
  - name: Notes
    description: Shared project notes with nested pages and Markdown content.
  - name: Telephony
    description: Phone gateway hooks called by the Asterisk dialplan with a channel token.
paths:
  /api/v1/notes/shares:
    parameters:
      - $ref: "#/components/parameters/ProjectScope"
    get:
      tags: [Notes]
      operationId: listNoteShares
      summary: List active public links for the selected project
      description: Requires notes:write. Random link secrets and password hashes are never returned by this list.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Active project note shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteShareListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Notes]
      operationId: createNoteShare
      summary: Create a public link to project notes or a note subtree
      description: >-
        Requires notes:write. By default a null note_id shares every note in the selected project, including future
        notes; otherwise the selected note and its descendants are shared. include_descendants and
        included_note_ids can restrict this tree. An explicit selection must include every ancestor
        up to the implicit share root or project root level. Other projects
        and aggregated subprojects are excluded. A custom slug is the public token itself. Random
        secrets begin with an underscore and are returned only in this creation response.
        Links have no configurable expiration date.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteShareRequest"
      responses:
        "201":
          description: Public link created; copy its token before dismissing the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedNoteShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: The JSON body contains unknown fields or has invalid field types.
        "429":
          $ref: "#/components/responses/NoteShareUnlockRateLimited"
  /api/v1/notes/shares/{share_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectScope"
      - in: path
        name: share_id
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Notes]
      operationId: updateNoteShare
      summary: Replace publication appearance and page selection
      description: >-
        Requires notes:write and the current expected_version. All appearance and visibility settings
        are required, including explicit nullable fields. The original token, custom slug, password and
        root stay unchanged. Changes immediately apply to existing unlocked access tokens and every
        public page, edit and database operation. Selected IDs must belong to the current project and
        share subtree and include all ancestors between each selection and the root. Other projects
        and aggregate subprojects are excluded. A stale version returns 409 without changing the share.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteShareRequest"
      responses:
        "200":
          description: Saved publication settings with incremented version, without random secret or password hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteShare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Required fields are missing, fields have invalid types or unknown fields are present.
    delete:
      tags: [Notes]
      operationId: revokeNoteShare
      summary: Revoke a public note link
      description: Requires notes:write in the selected project. Subsequent public reads and edits through this link are denied. Revoking an already revoked link also succeeds.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Public link revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/public/notes/resolve:
    post:
      tags: [Notes]
      operationId: resolvePublicNotes
      summary: Read notes through a public link
      description: >-
        Does not use operator authentication. Send the link token and optional unlocked access_token
        in JSON, with credentials omitted. Returns only notes currently inside the share scope.
        Public summaries omit favorite status, private project/account metadata and the stored selection whitelist.
        Page selection, descendant traversal and appearance settings are rechecked on every request.
        The shared subtree root has parent_id null to hide ancestors outside the scope.
        The browser page is /notes/share/{token}; note selection may use its note query parameter.
        Public responses must not be cached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePublicNotesRequest"
      responses:
        "200":
          description: Accessible note tree and selected note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicNotes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PublicNoteShareLocked"
        "404":
          $ref: "#/components/responses/PublicNoteShareUnavailable"
        "422":
          description: The JSON body is missing required fields, contains unknown fields, or has invalid field types.
  /api/v1/public/notes/unlock:
    post:
      tags: [Notes]
      operationId: unlockPublicNotes
      summary: Unlock a password-protected public note link
      description: >-
        Send the link token and password in JSON with credentials omitted. Returns an access token
        valid for 12 hours; subsequent public requests include it as access_token in JSON.
        This operation does not create an operator session. Responses must not be cached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockPublicNotesRequest"
      responses:
        "200":
          description: Link unlocked for 12 hours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockedPublicNotes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PublicNoteShareLocked"
        "404":
          $ref: "#/components/responses/PublicNoteShareUnavailable"
        "422":
          description: The JSON body is missing required fields, contains unknown fields, or has invalid field types.
        "429":
          $ref: "#/components/responses/NoteShareUnlockRateLimited"
  /api/v1/public/notes/page:
    patch:
      tags: [Notes]
      operationId: updatePublicNote
      summary: Edit an existing note through a public link
      description: >-
        Send token, optional access_token, note_id, title, body, icon and expected_version in JSON,
        with credentials omitted. Requires an active link with can_edit and current scope access.
        Only the existing note's title, body and icon can change; creating, deleting, moving notes,
        changing favorite status and managing links are not permitted. Uses the same content limits
        and optimistic version checks as authenticated note editing. Responses must not be cached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicNoteRequest"
      responses:
        "200":
          description: Saved public note with its incremented version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PublicNoteShareLocked"
        "403":
          description: The public link does not allow editing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/PublicNoteShareUnavailable"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: The JSON body is missing required fields, contains unknown fields, or has invalid field types.
  /api/v1/notes/databases:
    parameters:
      - $ref: "#/components/parameters/ProjectScope"
    get:
      tags:
