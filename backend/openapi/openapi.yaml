  /api/v1/conversations/{conversation_id}/attachments:
    post:
      tags: [Operator]
      operationId: uploadOperatorAttachment
      summary: Upload one security-scanned attachment as the assigned operator
      security:
        - cookieAuth: []
        - bearerAuth: []
